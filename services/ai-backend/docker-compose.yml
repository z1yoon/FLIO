# FLIO AI Backend - Local Development
version: '3.8'

services:
  ai-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HOME=/app/model_cache
    volumes:
      # Mount source code for development
      - ./app:/app/app
      # Persist model cache
      - ai-model-cache:/app/model_cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Models take time to load
    restart: unless-stopped

volumes:
  ai-model-cache:
    driver: local
